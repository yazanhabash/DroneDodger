<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Dodger</title>
<style>
  :root {
    --bg: #0b3448;
    --panel: rgba(4, 28, 42, 0.93);
    --text: #eaf6ff;
    --muted: #9fc3d6;
    --accent: #ffd166;
    --good: #7cf29c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .wrap {
    position: relative;
    width: min(100%, calc((100vh - 32px) * 2 / 3));
    width: min(100%, calc((100dvh - 32px) * 2 / 3));
    aspect-ratio: 2 / 3;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    border: 1px solid #0f4a63;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .menu {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .menu[hidden] { display: none; }
  .card {
    background: var(--panel);
    border: 1px solid #1d6684;
    border-radius: 14px;
    padding: 22px 20px;
    text-align: center;
    width: 100%;
    max-width: 360px;
  }
  h1 { margin: 0 0 8px; font-size: clamp(24px, 6vw, 32px); letter-spacing: 1px; }
  .ver { margin: -4px 0 10px; color: var(--muted); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .how { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .how strong { color: var(--text); }
  .scores { display: flex; justify-content: center; gap: 28px; margin: 0 0 8px; }
  .scores div { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .scores strong { display: block; font-size: 28px; color: var(--text); letter-spacing: 0; }
  .newtop { color: var(--good); font-weight: 700; margin: 0 0 10px; min-height: 1.3em; }
  button {
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    color: #2b1d00;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 12px 34px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="480" height="720" aria-label="Drone Dodger game area"></canvas>
  <div class="menu" id="menu">
    <div class="card">
      <h1>Drone Dodger</h1>
      <p class="ver">Version 1.1</p>
      <p class="how">Drones, planes, missiles… and shoes are coming at your ship.<br>
        Steer with the <strong>arrow keys</strong>. On a phone, <strong>touch where you want to go</strong>.<br>
        Your hull takes 2 hits. The 3rd sinks you. Survive as long as you can and beat your top score.</p>
      <div class="scores">
        <div>Last score<strong id="lastScore">0</strong></div>
        <div>Top score<strong id="topScore">0</strong></div>
      </div>
      <p class="newtop" id="newTop" aria-live="polite"></p>
      <button id="newGame" type="button">New game</button>
    </div>
  </div>
</div>

<script>
(() => {
  // =====================================================================
  //  ENDLESS MODE — tune these to change how the game ramps up
  // =====================================================================
  //  Waves keep coming forever. Each wave is built as a 6-lane row
  //  (D = drone, S = shoe, PP = airplane, M = missile, . = open water),
  //  and every new wave keeps a clear route from the last one's opening,
  //  so there is always a way out.
  // =====================================================================
  const DIFFICULTY = {
    startSpeed: 140,      // how fast things come at you at the start
    speedUpEvery: 10,     // points between speed-ups
    speedUpFactor: 1.08,  // +8% each time
    maxSpeed: 280,        // never faster than this
    spacing: 280,         // distance between waves
    fillStart: 0.45,      // how crowded waves are at the start (0 to 1)
    fillEnd: 0.85,        // how crowded they get
    fillRampScore: 60,    // score at which waves reach full crowding
    planesFrom: 10,       // airplanes join at this score
    missilesFrom: 25,     // missiles join at this score
    maxShift: 2           // the open lane moves at most this many lanes per wave
  };

  // ---------- Game settings ----------
  const SETTINGS = {
    shipSpeed: 280,         // how fast the ship moves while steering (pixels per second)
    hull: 3,                // hits until the ship sinks (the last one ends the game)
    safeTime: 1.5,          // seconds of no damage after a hit
    firstWaveDelay: 140,    // calm distance before the first wave
    introTime: 2.5,         // seconds the opening message shows
    fasterMessageTime: 1.0,
    sunkPause: 1.2
  };

  const W = 480, H = 720, LANES = 6;
  const LANE = W / LANES;
  const SHIP = { w: 28, h: 108, startY: H - 140 };    // long, thin tanker
  const SHIP_ROW = SHIP.startY + SHIP.h / 2;   // wave objects all arrive at this row together
  const STORE_LAST = "droneDodger.lastScore";
  const STORE_TOP = "droneDodger.topScore";

  // Size of each drawing, its (slightly smaller) hit box, and speed vs a drone
  const TYPES = {
    D: { name: "drone",   w: 51,  h: 51, hitW: 42,  hitH: 42, speed: 1 },     // 10% bigger in v1.1
    S: { name: "shoe",    w: 50,  h: 50, hitW: 34,  hitH: 34, speed: 1 },
    P: { name: "plane",   w: 126, h: 68, hitW: 112, hitH: 36, speed: 1.5 },   // 10% smaller in v1.1
    M: { name: "missile", w: 20,  h: 70, hitW: 14,  hitH: 62, speed: 2 }
  };

  // ---------- Page elements ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const menu = document.getElementById("menu");
  const newGameBtn = document.getElementById("newGame");
  const lastEl = document.getElementById("lastScore");
  const topEl = document.getElementById("topScore");
  const newTopEl = document.getElementById("newTop");

  // ---------- Saved scores (safe if storage is blocked) ----------
  function loadNumber(key) {
    try { return Math.max(0, parseInt(localStorage.getItem(key), 10) || 0); }
    catch (e) { return 0; }
  }
  function saveNumber(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) { /* keep playing */ }
  }
  let lastScore = loadNumber(STORE_LAST);
  let topScore = loadNumber(STORE_TOP);

  // ---------- Sea decoration (fixed pattern) ----------
  function makeRandom(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const seaRandom = makeRandom(11);
  // short wave crests scattered over the surface
  const crests = Array.from({ length: 90 }, () => ({
    x: seaRandom() * W, y: seaRandom() * H,
    len: 10 + seaRandom() * 22, phase: seaRandom() * Math.PI * 2,
    a: 0.18 + seaRandom() * 0.3
  }));
  const sparkles = Array.from({ length: 26 }, () => ({
    x: seaRandom() * W, y: seaRandom() * H, phase: seaRandom() * Math.PI * 2
  }));

  // ---------- Repeatable randomness (add ?seed=123 to the URL to test) ----------
  const seedParam = new URLSearchParams(location.search).get("seed");
  let random = makeRandom(seedParam ? Number(seedParam) : Date.now());

  // ---------- Game state ----------
  // menu | playing | paused | sunk
  let state = "menu";
  let menuOpenedAt = 0;
  let g = null;

  function newGameState() {
    if (seedParam) random = makeRandom(Number(seedParam));
    return {
      x: W / 2 - SHIP.w / 2,
      y: SHIP.startY,
      score: 0,
      hull: SETTINGS.hull,
      speed: DIFFICULTY.startSpeed,
      waves: [],
      waveCount: 0,
      distanceToNext: SETTINGS.firstWaveDelay,
      safeLane: random() < 0.5 ? 2 : 3,
      safeTimer: 0,
      fasterTimer: 0,
      introTimer: SETTINGS.introTime,
      timer: 0,
      wake: [],
      wakeClock: 0,
      seaScroll: 0,
      time: 0
    };
  }

  // Build the next wave as a 6-lane row, keeping a clear route to its opening
  function makeWaveText() {
    const d = DIFFICULTY;
    const prev = g.safeLane;
    const shift = Math.floor(random() * (d.maxShift * 2 + 1)) - d.maxShift;
    const safe = Math.max(0, Math.min(LANES - 1, prev + shift));
    g.safeLane = safe;

    const row = new Array(LANES).fill(".");
    const keepOpen = new Array(LANES).fill(false);
    for (let l = Math.min(prev, safe); l <= Math.max(prev, safe); l++) keepOpen[l] = true;

    const fill = d.fillStart + (d.fillEnd - d.fillStart) * Math.min(1, g.score / d.fillRampScore);
    for (let lane = 0; lane < LANES; lane++) {
      if (keepOpen[lane] || random() > fill) continue;
      if (g.score >= d.planesFrom && lane + 1 < LANES && !keepOpen[lane + 1] && random() < 0.25) {
        row[lane] = row[lane + 1] = "P"; lane++; continue;
      }
      const roll = random();
      if (g.score >= d.missilesFrom && roll < 0.35) row[lane] = "M";
      else row[lane] = roll < 0.85 ? "D" : "S";
    }
    if (!row.includes("D") && !row.includes("S") && !row.includes("P") && !row.includes("M")) {
      const lane = keepOpen.indexOf(false);
      if (lane >= 0) row[lane] = "D";
    }
    return { text: row.join(""), safe };
  }

  function spawnWave(text, index, safe) {
    const wave = { index, safe, passed: false, objects: [] };
    const baseY = -60;
    for (let lane = 0; lane < LANES; lane++) {
      const c = text[lane];
      if (c === "." || !TYPES[c]) continue;
      let cx = lane * LANE + LANE / 2;
      if (c === "P") { cx = (lane + 1) * LANE; lane++; }      // plane covers two lanes
      const t = TYPES[c];
      // Faster objects start higher up so the whole wave reaches the ship's row together
      const cy = SHIP_ROW - t.speed * (SHIP_ROW - baseY);
      wave.objects.push({ type: c, cx, cy, spin: lane * 1.3 });
    }
    if (wave.objects.length) g.waves.push(wave);
  }

  // ---------- Menu / round flow ----------
  function showMenu(message) {
    state = "menu";
    menuOpenedAt = performance.now();
    lastEl.textContent = lastScore;
    topEl.textContent = topScore;
    newTopEl.textContent = message || "";
    menu.hidden = false;
    newGameBtn.focus({ preventScroll: true });
  }

  const input = { left: false, right: false, up: false, down: false, target: null };
  function clearInput() { input.left = input.right = input.up = input.down = false; input.target = null; }

  function startGame() {
    g = newGameState();
    clearInput();
    menu.hidden = true;
    state = "playing";
    canvas.focus({ preventScroll: true });
  }

  function pause() {
    clearInput();
    if (state === "playing") state = "paused";
  }

  function finishGame() {
    lastScore = g.score;
    const beat = g.score > topScore;
    if (beat) topScore = g.score;
    saveNumber(STORE_LAST, lastScore);
    saveNumber(STORE_TOP, topScore);
    showMenu(beat ? "New top score!" : "");
  }

  // ---------- Rules: one fixed step of the simulation ----------
  function step(dt) {
    if (state === "sunk") {
      g.timer -= dt;
      g.seaScroll += 40 * dt;
      updateWake(dt, false);
      if (g.timer <= 0) finishGame();
      return;
    }
    if (state !== "playing") return;

    g.time += dt;
    g.seaScroll += g.speed * 0.35 * dt;
    if (g.safeTimer > 0) g.safeTimer = Math.max(0, g.safeTimer - dt);
    if (g.introTimer > 0) g.introTimer = Math.max(0, g.introTimer - dt);
    if (g.fasterTimer > 0) g.fasterTimer = Math.max(0, g.fasterTimer - dt);

    moveShip(dt);
    updateWake(dt, true);

    // Bring in the next wave
    g.distanceToNext -= g.speed * dt;
    if (g.distanceToNext <= 0) {
      const w = makeWaveText();
      spawnWave(w.text, g.waveCount, w.safe);
      g.waveCount++;
      g.distanceToNext += DIFFICULTY.spacing;
    }

    // Move objects (each type at its own speed)
    for (const w of g.waves) {
      for (const o of w.objects) {
        o.cy += g.speed * TYPES[o.type].speed * dt;
        if (o.type === "S") o.spin += dt * 5;
        if (o.type === "D") o.spin += dt * 30;
      }
    }

    // Hits
    const sx = g.x + 5, sy = g.y + 6, sw = SHIP.w - 10, sh = SHIP.h - 12;
    if (g.safeTimer === 0) {
      outer:
      for (const w of g.waves) {
        for (const o of w.objects) {
          const t = TYPES[o.type];
          const ox = o.cx - t.hitW / 2, oy = o.cy - t.hitH / 2;
          if (sx < ox + t.hitW && sx + sw > ox && sy < oy + t.hitH && sy + sh > oy) {
            g.hull -= 1;
            if (g.hull <= 0) { state = "sunk"; g.timer = SETTINGS.sunkPause; return; }
            g.safeTimer = SETTINGS.safeTime;
            break outer;
          }
        }
      }
    }

    // Score: +1 when a whole wave has gone past the ship
    const shipBottom = Math.min(g.y + SHIP.h, H - 1);
    for (const w of g.waves) {
      if (w.passed) continue;
      const lowestTop = Math.min(...w.objects.map(o => o.cy - TYPES[o.type].h / 2));
      if (lowestTop > shipBottom) {
        w.passed = true;
        g.score += 1;
        if (g.score % DIFFICULTY.speedUpEvery === 0) {
          const steps = g.score / DIFFICULTY.speedUpEvery;
          const next = Math.min(DIFFICULTY.startSpeed * Math.pow(DIFFICULTY.speedUpFactor, steps), DIFFICULTY.maxSpeed);
          if (next > g.speed) { g.speed = next; g.fasterTimer = SETTINGS.fasterMessageTime; }
        }
      }
    }

    // Remove objects that have left the screen, and empty waves
    for (const w of g.waves) w.objects = w.objects.filter(o => o.cy - 90 < H);
    g.waves = g.waves.filter(w => w.objects.length > 0);

  }

  function moveShip(dt) {
    let dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    let dy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
    if (dx === 0 && dy === 0 && input.target) {
      // Touch / mouse: head toward the finger
      const tx = input.target.x - (g.x + SHIP.w / 2);
      const ty = input.target.y - (g.y + SHIP.h / 2);
      const dist = Math.hypot(tx, ty);
      if (dist > 4) {
        const stepLen = Math.min(dist, SETTINGS.shipSpeed * dt);
        g.x += tx / dist * stepLen;
        g.y += ty / dist * stepLen;
      }
    } else if (dx || dy) {
      const len = Math.hypot(dx, dy);
      g.x += dx / len * SETTINGS.shipSpeed * dt;
      g.y += dy / len * SETTINGS.shipSpeed * dt;
    }
    g.x = Math.max(0, Math.min(W - SHIP.w, g.x));
    g.y = Math.max(50, Math.min(H - SHIP.h, g.y));      // stay below the score bar
  }

  // Wake: remember where the stern has been; the water carries those points away
  const WAKE_LIFE = 0.9;         // seconds a wake line lasts (shorter = shorter wake)
  const WAKE_SPREAD = 70;        // how wide the V opens (bigger = wider wake)
  function updateWake(dt, emit) {
    const flow = g.speed * 0.35;                       // same speed as the sea surface
    g.wakeClock += dt;
    if (emit && g.wakeClock > 0.03) {
      g.wakeClock = 0;
      g.wake.push({ x: g.x + SHIP.w / 2, y: g.y + SHIP.h - 6, age: 0 });
    }
    for (const p of g.wake) { p.age += dt; p.y += flow * dt; }
    g.wake = g.wake.filter(p => p.age < WAKE_LIFE);
  }

  // ---------- Drawing ----------
  function drawSea() {
    // daylight surface colour
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#2f8fb8");
    grad.addColorStop(1, "#22789f");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const scroll = g ? g.seaScroll : performance.now() / 1000 * 30;
    const time = performance.now() / 1000;

    // broad, soft swells
    for (let row = -1; row < H / 120 + 1; row++) {
      const y0 = ((row * 120 + scroll * 0.6) % (H + 120)) - 60;
      ctx.fillStyle = "rgba(255,255,255,0.035)";
      ctx.beginPath();
      ctx.moveTo(0, y0);
      for (let x = 0; x <= W; x += 16) ctx.lineTo(x, y0 + Math.sin(x / 70 + row) * 10);
      ctx.lineTo(W, y0 + 40);
      for (let x = W; x >= 0; x -= 16) ctx.lineTo(x, y0 + 40 + Math.sin(x / 70 + row + 1) * 10);
      ctx.closePath();
      ctx.fill();
    }

    // wave crests: a bright edge with a soft shadow just below
    ctx.lineCap = "round";
    for (const c of crests) {
      const y = (c.y + scroll) % H;
      const x = c.x + Math.sin(time * 0.8 + c.phase) * 3;
      ctx.strokeStyle = "rgba(10,60,90,0.18)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - c.len / 2, y + 2);
      ctx.quadraticCurveTo(x, y - 3, x + c.len / 2, y + 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${c.a})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - c.len / 2, y);
      ctx.quadraticCurveTo(x, y - 5, x + c.len / 2, y);
      ctx.stroke();
    }

    // sunlight glints
    for (const s of sparkles) {
      const a = Math.max(0, Math.sin(time * 2 + s.phase)) * 0.7;
      if (a < 0.05) continue;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(s.x, (s.y + scroll) % H, 2, 2);
    }
    ctx.lineCap = "butt";
  }

  // Minimal wake: two thin lines opening into a wide, short V, and a faint wash in the middle
  function drawWake() {
    const pts = g.wake;
    if (pts.length < 2) return;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const ka = a.age / WAKE_LIFE, k = b.age / WAKE_LIFE;
      // centre wash
      ctx.strokeStyle = `rgba(255,255,255,${0.25 * (1 - k)})`;
      ctx.lineWidth = 6 + k * 14;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      // spreading edges
      ctx.strokeStyle = `rgba(255,255,255,${0.55 * (1 - k)})`;
      ctx.lineWidth = 1.4;
      for (const side of [-1, 1]) {
        const sa = 8 + ka * WAKE_SPREAD, sb = 8 + k * WAKE_SPREAD;
        ctx.beginPath();
        ctx.moveTo(a.x + side * sa, a.y);
        ctx.lineTo(b.x + side * sb, b.y);
        ctx.stroke();
      }
    }
  }

  // Minimal flat ship seen from above: one soft cream hull, a dark bridge block
  function drawShip(x, y, flashing, t) {
    if (flashing && Math.floor(t * 10) % 2 === 0) ctx.globalAlpha = 0.35;
    const w = SHIP.w, h = SHIP.h, cx = x + w / 2, bow = 0.26;
    // smooth hull: pointed bow, straight sides, gently rounded stern
    const hull = new Path2D();
    hull.moveTo(cx, y);
    hull.bezierCurveTo(x + w * 0.78, y + h * bow * 0.25, x + w, y + h * bow * 0.6, x + w, y + h * bow);
    hull.lineTo(x + w, y + h - w * 0.35);
    hull.quadraticCurveTo(x + w, y + h, cx, y + h);
    hull.quadraticCurveTo(x, y + h, x, y + h - w * 0.35);
    hull.lineTo(x, y + h * bow);
    hull.bezierCurveTo(x, y + h * bow * 0.6, x + w * 0.22, y + h * bow * 0.25, cx, y);
    hull.closePath();
    // soft shadow on the water
    ctx.save();
    ctx.translate(3, 5);
    ctx.fillStyle = "rgba(0,30,50,0.28)";
    ctx.fill(hull);
    ctx.restore();
    // cream hull with a gentle shade down one side
    ctx.fillStyle = "#f3efe7";
    ctx.fill(hull);
    ctx.save();
    ctx.clip(hull);
    ctx.fillStyle = "rgba(30,50,70,0.12)";
    ctx.fillRect(x + w * 0.62, y, w, h);
    ctx.restore();
    // three faint hatch lines
    ctx.strokeStyle = "rgba(38,50,63,0.35)";
    ctx.lineWidth = 1;
    for (const f of [0.3, 0.45, 0.6]) {
      ctx.beginPath();
      ctx.moveTo(x + 6, y + h * f);
      ctx.lineTo(x + w - 6, y + h * f);
      ctx.stroke();
    }
    // bridge block
    ctx.fillStyle = "#26323f";
    ctx.beginPath();
    ctx.roundRect(x + 5, y + h * 0.74, w - 10, 12, 3);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawDrone(o) {
    const { cx, cy } = o;
    ctx.fillStyle = "rgba(0,0,0,0.18)";                         // shadow on the water
    ctx.beginPath(); ctx.ellipse(cx + 8, cy + 10, 20, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#7a3550";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy - 16); ctx.lineTo(cx + 16, cy + 16);
    ctx.moveTo(cx + 16, cy - 16); ctx.lineTo(cx - 16, cy + 16);
    ctx.stroke();
    for (const [dx, dy] of [[-16, -16], [16, -16], [-16, 16], [16, 16]]) {
      ctx.fillStyle = "rgba(220,230,245,0.4)";
      ctx.beginPath(); ctx.arc(cx + dx, cy + dy, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#eef2f8"; ctx.lineWidth = 2;
      const a = o.spin;
      ctx.beginPath();
      ctx.moveTo(cx + dx - Math.cos(a) * 8, cy + dy - Math.sin(a) * 8);
      ctx.lineTo(cx + dx + Math.cos(a) * 8, cy + dy + Math.sin(a) * 8);
      ctx.stroke();
    }
    ctx.fillStyle = "#5b2a3d";
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff4d6d";
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
  }

  function drawPlane(o) {
    const { cx, cy } = o;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(cx + 14, cy + 18, 60, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c8ced9";
    ctx.beginPath();
    ctx.moveTo(cx, cy - 6);
    ctx.lineTo(cx + 70, cy - 14); ctx.lineTo(cx + 70, cy - 4);
    ctx.lineTo(cx + 10, cy + 14); ctx.lineTo(cx - 10, cy + 14);
    ctx.lineTo(cx - 70, cy - 4); ctx.lineTo(cx - 70, cy - 14);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx, cy - 30);
    ctx.lineTo(cx + 22, cy - 38); ctx.lineTo(cx + 22, cy - 32);
    ctx.lineTo(cx - 22, cy - 32); ctx.lineTo(cx - 22, cy - 38);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e9edf5";
    ctx.beginPath(); ctx.ellipse(cx, cy, 8, 38, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a93a8";
    ctx.fillRect(cx - 34, cy - 6, 8, 16);
    ctx.fillRect(cx + 26, cy - 6, 8, 16);
    ctx.fillStyle = "#3b4b7a";
    ctx.beginPath(); ctx.ellipse(cx, cy + 26, 4, 6, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawMissile(o, t) {
    const { cx, cy } = o, h = TYPES.M.h;
    const top = cy - h / 2;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(cx + 6, top + 10, 8, h - 10);
    ctx.fillStyle = "#ffb347";
    ctx.beginPath();
    ctx.moveTo(cx - 5, top + 4);
    ctx.lineTo(cx, top - 14 - Math.sin(t * 40 + cx) * 5);
    ctx.lineTo(cx + 5, top + 4);
    ctx.fill();
    ctx.fillStyle = "#d9dde6";
    ctx.fillRect(cx - 6, top + 4, 12, h - 20);
    ctx.fillStyle = "#e63946";
    ctx.beginPath();
    ctx.moveTo(cx - 6, top + h - 16); ctx.lineTo(cx, top + h); ctx.lineTo(cx + 6, top + h - 16);
    ctx.fill();
    ctx.fillStyle = "#6c7486";
    ctx.beginPath();
    ctx.moveTo(cx - 6, top + 6); ctx.lineTo(cx - 12, top + 2); ctx.lineTo(cx - 6, top + 18);
    ctx.moveTo(cx + 6, top + 6); ctx.lineTo(cx + 12, top + 2); ctx.lineTo(cx + 6, top + 18);
    ctx.fill();
  }

  function drawShoe(o) {
    ctx.save();
    ctx.translate(o.cx, o.cy);
    ctx.rotate(o.spin);
    ctx.fillStyle = "#f2f2f2";
    ctx.beginPath(); ctx.roundRect(-24, 6, 48, 8, 4); ctx.fill();
    ctx.fillStyle = "#ff6b35";
    ctx.beginPath();
    ctx.moveTo(-22, 6); ctx.lineTo(-22, -12);
    ctx.quadraticCurveTo(-18, -16, -10, -14);
    ctx.lineTo(-4, -4);
    ctx.quadraticCurveTo(14, -6, 24, 6);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -9); ctx.lineTo(-2, -2);
    ctx.moveTo(-2, -10); ctx.lineTo(4, -3);
    ctx.stroke();
    ctx.restore();
  }

  // Draw an object bigger or smaller around its own centre
  function drawScaled(o, scale, fn) {
    ctx.save();
    ctx.translate(o.cx, o.cy);
    ctx.scale(scale, scale);
    fn({ ...o, cx: 0, cy: 0 });
    ctx.restore();
  }

  function drawObjects(t) {
    for (const w of g.waves) for (const o of w.objects) {
      if (o.type === "D") drawScaled(o, 1.1, drawDrone);
      else if (o.type === "P") drawScaled(o, 0.9, drawPlane);
      else if (o.type === "M") drawMissile(o, t);
      else drawShoe(o);
    }
  }

  function drawHud() {
    ctx.fillStyle = "rgba(3,30,44,0.55)";
    ctx.fillRect(0, 0, W, 46);
    ctx.fillStyle = "#eaf6ff";
    ctx.font = "bold 28px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(g.score), W / 2, 34);

    ctx.textAlign = "left";
    ctx.font = "bold 14px system-ui, sans-serif";
    ctx.fillStyle = "#9fc3d6";
    ctx.fillText("HULL", 14, 29);
    for (let i = 0; i < SETTINGS.hull; i++) {
      ctx.fillStyle = i < g.hull ? "#7cf29c" : "#1b4a5e";
      ctx.fillRect(58 + i * 20, 17, 15, 14);
    }
    ctx.textAlign = "right";
    ctx.fillStyle = "#9fc3d6";
    ctx.fillText(`TOP ${Math.max(topScore, g.score)}`, W - 14, 29);

    ctx.textAlign = "center";
    if (state === "playing" && g.introTimer > 0) {
      const a = Math.min(1, g.introTimer * 1.5);
      ctx.fillStyle = `rgba(255,209,102,${a})`;
      ctx.font = "bold 28px system-ui, sans-serif";
      ctx.fillText("How far can you go?", W / 2, 165);
      ctx.fillStyle = `rgba(234,246,255,${a})`;
      ctx.font = "15px system-ui, sans-serif";
      ctx.fillText("Arrow keys to steer · touch to move on a phone", W / 2, 195);
    }
    if (g.fasterTimer > 0) {
      ctx.fillStyle = `rgba(255,209,102,${Math.min(1, g.fasterTimer * 2)})`;
      ctx.font = "bold 34px system-ui, sans-serif";
      ctx.fillText("Faster!", W / 2, 110);
    }
  }

  function drawBanner(text, sub) {
    ctx.fillStyle = "rgba(3,30,44,0.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#eaf6ff";
    ctx.font = "bold 38px system-ui, sans-serif";
    ctx.fillText(text, W / 2, H / 2);
    if (sub) {
      ctx.font = "18px system-ui, sans-serif";
      ctx.fillStyle = "#9fc3d6";
      ctx.fillText(sub, W / 2, H / 2 + 36);
    }
  }

  function draw(t) {
    drawSea();
    if (!g) return;
    drawWake();
    drawShip(g.x, g.y, g.safeTimer > 0 || state === "sunk", t);
    drawObjects(t);
    drawHud();
    if (state === "paused") drawBanner("Paused", "Tap or press Space to continue");
    if (state === "sunk") drawBanner("Sunk!", "Score: " + g.score);
  }

  // ---------- Main loop (fixed steps, one loop for the whole page) ----------
  const STEP = 1 / 120;
  let lastTime = performance.now();
  let acc = 0, visualTime = 0;
  function frame(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;                // after a long gap, never jump ahead
    if (state !== "menu" && state !== "paused") {
      acc += dt;
      while (acc >= STEP && state !== "menu") { step(STEP); acc -= STEP; }
    } else {
      acc = 0;
    }
    if (state !== "paused") visualTime += dt;
    draw(visualTime);
    requestAnimationFrame(frame);
  }

  // ---------- Controls ----------
  const KEYS = {
    ArrowLeft: "left", KeyA: "left",
    ArrowRight: "right", KeyD: "right",
    ArrowUp: "up", KeyW: "up",
    ArrowDown: "down", KeyS: "down"
  };

  window.addEventListener("keydown", (e) => {
    const dir = KEYS[e.code];
    const isStart = e.code === "Space" || e.key === "Enter";
    if (!dir && !isStart) return;

    if (state === "menu") {
      if (!isStart) return;
      e.preventDefault();
      if (e.repeat) return;
      if (performance.now() - menuOpenedAt < 400) return;     // avoid accidental restart
      startGame();
      return;
    }
    e.preventDefault();
    if (state === "paused") {
      if (!e.repeat) state = "playing";
      if (isStart) return;
    }
    if (dir) input[dir] = true;
  });

  window.addEventListener("keyup", (e) => {
    const dir = KEYS[e.code];
    if (dir) input[dir] = false;
  });

  // Touch / mouse: the ship heads toward where you hold your finger
  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (state === "paused") { state = "playing"; return; }
    if (state !== "playing") return;
    canvas.setPointerCapture?.(e.pointerId);
    input.target = toCanvas(e);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (input.target) input.target = toCanvas(e);
  });
  for (const ev of ["pointerup", "pointercancel"]) {
    canvas.addEventListener(ev, () => { input.target = null; });
  }

  newGameBtn.addEventListener("click", () => { if (state === "menu") startGame(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  window.addEventListener("blur", pause);

  // Read-only peek for testing in the browser console
  window.droneDodger = {
    get state() { return state; },
    get score() { return g ? g.score : 0; },
    get hull() { return g ? g.hull : SETTINGS.hull; },
    get speed() { return g ? g.speed : 0; },
    get x() { return g ? g.x : 0; },
    get y() { return g ? g.y : 0; },
    get waveCount() { return g ? g.waveCount : 0; },
    get waves() {
      return g ? g.waves.map(w => ({ index: w.index, safe: w.safe, passed: w.passed, objects: w.objects.map(o => ({ type: o.type, cx: o.cx, cy: o.cy })) })) : [];
    },
    get lastScore() { return lastScore; },
    get topScore() { return topScore; },
    lane: LANE, ship: SHIP
  };

  showMenu("");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
