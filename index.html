<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Dodger</title>
<style>
  :root {
    --bg: #04202e;
    --panel: rgba(4, 28, 42, 0.93);
    --text: #eaf6ff;
    --muted: #9fc3d6;
    --accent: #ffd166;
    --good: #7cf29c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .wrap {
    position: relative;
    width: min(100%, calc((100vh - 32px) * 2 / 3));
    width: min(100%, calc((100dvh - 32px) * 2 / 3));
    aspect-ratio: 2 / 3;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    border: 1px solid #0f4a63;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .menu {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .menu[hidden] { display: none; }
  .card {
    background: var(--panel);
    border: 1px solid #1d6684;
    border-radius: 14px;
    padding: 22px 20px;
    text-align: center;
    width: 100%;
    max-width: 360px;
  }
  h1 { margin: 0 0 8px; font-size: clamp(24px, 6vw, 32px); letter-spacing: 1px; }
  .how { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .how strong { color: var(--text); }
  .scores { display: flex; justify-content: center; gap: 28px; margin: 0 0 8px; }
  .scores div { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .scores strong { display: block; font-size: 28px; color: var(--text); letter-spacing: 0; }
  .newtop { color: var(--good); font-weight: 700; margin: 0 0 10px; min-height: 1.3em; }
  button {
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    color: #2b1d00;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 12px 34px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game" width="480" height="720" aria-label="Drone Dodger game area"></canvas>
  <div class="menu" id="menu">
    <div class="card">
      <h1>Drone Dodger</h1>
      <p class="how">Drones, planes, missiles… and shoes are coming at your ship.<br>
        Steer with the <strong>arrow keys</strong>. On a phone, <strong>touch where you want to go</strong>.<br>
        Your hull takes 2 hits. The 3rd sinks you. Clear every level to win.</p>
      <div class="scores">
        <div>Last score<strong id="lastScore">0</strong></div>
        <div>Top score<strong id="topScore">0</strong></div>
      </div>
      <p class="newtop" id="newTop" aria-live="polite"></p>
      <button id="newGame" type="button">New game</button>
    </div>
  </div>
</div>

<script>
(() => {
  // =====================================================================
  //  LEVELS — edit these to design the game
  // =====================================================================
  //  Each level is a list of WAVES, played from top to bottom.
  //  Each wave is exactly 6 characters, one per lane, left to right:
  //
  //     D = drone      (slowest, 1x)
  //     S = shoe       (just for fun, 1x)
  //     P = airplane   (1.5x) — always write it as a pair: "PP"
  //     M = missile    (fastest, 2x)
  //     . = open water (the ship can pass here)
  //
  //  A wave of only dots, "......", is a short breather.
  //  speed   = how fast this level moves (bigger = faster)
  //  spacing = distance between waves (bigger = more time to react)
  //
  //  Every wave needs a way out. The game checks this when it loads and
  //  lists any problem waves in the browser console.
  // =====================================================================
  const LEVELS = [
    {
      name: "Calm Waters",
      speed: 140,
      spacing: 300,
      waves: [
        "D....D",
        ".D..D.",
        "DD....",
        "DDD...",
        "......",
        "....DD",
        "S..D.D",
        "D.D...",
        "D..D.S",
        "DD..DD",
        "DDD..D",
        "DS..DD",
        "D.D...",
        "D...DD",
        "DDD..D"
      ]
    },
    {
      name: "Air Patrol",
      speed: 165,
      spacing: 280,
      waves: [
        "PP....",
        "...PP.",
        "D....D",
        "PP..PP",
        "..D...",
        "PP.D..",
        "PPD...",
        "D.PP..",
        "......",
        "PP.S.D",
        "PP.D..",
        "PPD...",
        "PPDS..",
        "S.PP.D",
        "PP.D..",
        "DD...D",
        "PP.PP.",
        ".D.D.D"
      ]
    },
    {
      name: "Missile Storm",
      speed: 185,
      spacing: 270,
      waves: [
        "M....M",
        ".M..M.",
        "MM....",
        "...MMM",
        "D.M.M.",
        "M...PP",
        "M.M..D",
        ".MMM..",
        "......",
        "MM.PP.",
        "MM.MM.",
        "PPM...",
        "PP.M..",
        "M.SM.M",
        ".MMM.D",
        "PP.M..",
        "MMPP..",
        "MM.M..",
        "MMMM..",
        "MM.M.M"
      ]
    }
  ];

  // ---------- Game settings ----------
  const SETTINGS = {
    shipSpeed: 280,         // how fast the ship moves while steering (pixels per second)
    hull: 3,                // hits until the ship sinks (the last one ends the game)
    safeTime: 1.5,          // seconds of no damage after a hit
    firstWaveDelay: 140,    // calm distance before a level's first wave
    levelBannerTime: 2.2,
    levelClearTime: 1.8,
    sunkPause: 1.2
  };

  const W = 480, H = 720, LANES = 6;
  const LANE = W / LANES;
  const SHIP = { w: 38, h: 80, startY: H - 120 };
  const SHIP_ROW = SHIP.startY + SHIP.h / 2;   // wave objects all arrive at this row together
  const STORE_LAST = "droneDodger.lastScore";
  const STORE_TOP = "droneDodger.topScore";

  // Size of each drawing, its (slightly smaller) hit box, and speed vs a drone
  const TYPES = {
    D: { name: "drone",   w: 46,  h: 46, hitW: 38,  hitH: 38, speed: 1 },
    S: { name: "shoe",    w: 50,  h: 50, hitW: 34,  hitH: 34, speed: 1 },
    P: { name: "plane",   w: 140, h: 76, hitW: 124, hitH: 40, speed: 1.5 },
    M: { name: "missile", w: 20,  h: 70, hitW: 14,  hitH: 62, speed: 2 }
  };

  // ---------- Level checker: every wave must have a reachable way out ----------
  function checkLevel(level) {
    const problems = [];
    const waves = level.waves;
    waves.forEach((w, i) => {
      if (w.length !== LANES) problems.push(`wave ${i + 1} "${w}": needs exactly ${LANES} characters`);
      if (/[^DSPM.]/.test(w)) problems.push(`wave ${i + 1} "${w}": only D S P M . are allowed`);
      const pairs = w.replace(/PP/g, "");
      if (pairs.includes("P")) problems.push(`wave ${i + 1} "${w}": planes must be written as a pair "PP"`);
    });
    if (problems.length) return { ok: false, problems, path: [] };

    // Lanes the ship could be in safely, wave by wave (checked at the ship's start row)
    let reachable = null, rests = 0;
    const path = [];
    const history = [];
    for (let i = 0; i < waves.length; i++) {
      const w = waves[i];
      if (w === "......") { rests++; continue; }
      const open = [...w].map(c => c === ".");
      if (!open.includes(true)) {
        problems.push(`wave ${i + 1} "${w}": no open lane at all`);
        return { ok: false, problems, path: [] };
      }
      let next;
      if (reachable === null) {
        next = open.map(o => o);                       // first wave: plenty of time to get anywhere
      } else {
        // time from the previous wave clearing the ship until this wave's
        // neighbour arrives, turned into how many lanes the ship can cross
        const time = (2 * level.spacing * (1 + rests) - 160) / level.speed;
        const reach = Math.max(1, Math.floor(0.7 * SETTINGS.shipSpeed * time / LANE));
        next = open.map((o, j) => {
          if (!o) return false;
          for (let from = 0; from < LANES; from++) {
            if (!reachable[from] || Math.abs(from - j) > reach) continue;
            let clear = true;
            for (let l = Math.min(from, j); l <= Math.max(from, j); l++) if (!open[l]) clear = false;
            if (clear) return true;
          }
          return false;
        });
      }
      if (!next.includes(true)) {
        problems.push(`wave ${i + 1} "${w}": no way to reach an open lane from the wave before it`);
        return { ok: false, problems, path: [] };
      }
      history.push({ index: i, ok: next });
      reachable = next;
      rests = 0;
    }
    // Pick one safe route (walk backwards so every step connects)
    let lane = -1;
    for (let k = history.length - 1; k >= 0; k--) {
      const ok = history[k].ok;
      if (lane < 0 || !ok[lane]) {
        let best = -1;
        for (let j = 0; j < LANES; j++) if (ok[j] && (best < 0 || Math.abs(j - lane) < Math.abs(best - lane))) best = j;
        lane = best;
      }
      path[history[k].index] = lane;
    }
    return { ok: true, problems, path };
  }
  const LEVEL_CHECKS = LEVELS.map(checkLevel);
  LEVEL_CHECKS.forEach((c, i) => {
    if (!c.ok) console.warn(`Drone Dodger — Level ${i + 1} "${LEVELS[i].name}" needs fixing:\n` + c.problems.join("\n"));
  });

  // ---------- Page elements ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const menu = document.getElementById("menu");
  const newGameBtn = document.getElementById("newGame");
  const lastEl = document.getElementById("lastScore");
  const topEl = document.getElementById("topScore");
  const newTopEl = document.getElementById("newTop");

  // ---------- Saved scores (safe if storage is blocked) ----------
  function loadNumber(key) {
    try { return Math.max(0, parseInt(localStorage.getItem(key), 10) || 0); }
    catch (e) { return 0; }
  }
  function saveNumber(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (e) { /* keep playing */ }
  }
  let lastScore = loadNumber(STORE_LAST);
  let topScore = loadNumber(STORE_TOP);

  // ---------- Sea decoration (fixed pattern) ----------
  function makeRandom(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const seaRandom = makeRandom(11);
  const foam = Array.from({ length: 60 }, () => ({
    x: seaRandom() * W, y: seaRandom() * H,
    r: seaRandom() * 2.5 + 1, a: seaRandom() * 0.25 + 0.08
  }));

  // ---------- Game state ----------
  // menu | playing | paused | levelclear | sunk | won
  let state = "menu";
  let menuOpenedAt = 0;
  let g = null;

  function newGameState() {
    return {
      x: W / 2 - SHIP.w / 2,
      y: SHIP.startY,
      score: 0,
      hull: SETTINGS.hull,
      level: 0,
      safeTimer: 0,
      timer: 0,
      wake: [],
      wakeClock: 0,
      seaScroll: 0,
      ...newLevelState(0)
    };
  }

  function newLevelState(levelIndex) {
    return {
      level: levelIndex,
      speed: LEVELS[levelIndex].speed,
      nextWave: 0,
      distanceToNext: SETTINGS.firstWaveDelay,
      waves: [],
      bannerTimer: SETTINGS.levelBannerTime,
      time: 0
    };
  }

  function spawnWave(text, index) {
    const wave = { index, passed: false, objects: [] };
    const baseY = -60;
    for (let lane = 0; lane < LANES; lane++) {
      const c = text[lane];
      if (c === "." || !TYPES[c]) continue;
      let cx = lane * LANE + LANE / 2;
      if (c === "P") { cx = (lane + 1) * LANE; lane++; }      // plane covers two lanes
      const t = TYPES[c];
      // Faster objects start higher up so the whole wave reaches the ship's row together
      const cy = SHIP_ROW - t.speed * (SHIP_ROW - baseY);
      wave.objects.push({ type: c, cx, cy, spin: lane * 1.3 });
    }
    if (wave.objects.length) g.waves.push(wave);
  }

  // ---------- Menu / round flow ----------
  function showMenu(message) {
    state = "menu";
    menuOpenedAt = performance.now();
    lastEl.textContent = lastScore;
    topEl.textContent = topScore;
    newTopEl.textContent = message || "";
    menu.hidden = false;
    newGameBtn.focus({ preventScroll: true });
  }

  const input = { left: false, right: false, up: false, down: false, target: null };
  function clearInput() { input.left = input.right = input.up = input.down = false; input.target = null; }

  function startGame() {
    g = newGameState();
    clearInput();
    menu.hidden = true;
    state = "playing";
    canvas.focus({ preventScroll: true });
  }

  function pause() {
    clearInput();
    if (state === "playing") state = "paused";
  }

  function finishGame(won) {
    lastScore = g.score;
    const beat = g.score > topScore;
    if (beat) topScore = g.score;
    saveNumber(STORE_LAST, lastScore);
    saveNumber(STORE_TOP, topScore);
    const parts = [];
    if (won) parts.push(`You cleared all ${LEVELS.length} levels!`);
    if (beat) parts.push("New top score!");
    showMenu(parts.join(" "));
  }

  // ---------- Rules: one fixed step of the simulation ----------
  function step(dt) {
    if (state === "sunk" || state === "won" || state === "levelclear") {
      g.timer -= dt;
      g.seaScroll += 40 * dt;
      updateWake(dt, false);
      if (g.timer > 0) return;
      if (state === "sunk") return finishGame(false);
      if (state === "won") return finishGame(true);
      Object.assign(g, newLevelState(g.level + 1));      // next level; score, hull and position carry over
      state = "playing";
      return;
    }
    if (state !== "playing") return;

    g.time += dt;
    g.seaScroll += g.speed * 0.35 * dt;
    if (g.safeTimer > 0) g.safeTimer = Math.max(0, g.safeTimer - dt);
    if (g.bannerTimer > 0) g.bannerTimer = Math.max(0, g.bannerTimer - dt);

    moveShip(dt);
    updateWake(dt, true);

    // Bring in the next wave from the level preset
    const level = LEVELS[g.level];
    if (g.nextWave < level.waves.length) {
      g.distanceToNext -= g.speed * dt;
      if (g.distanceToNext <= 0) {
        spawnWave(level.waves[g.nextWave], g.nextWave);
        g.nextWave++;
        g.distanceToNext += level.spacing;
      }
    }

    // Move objects (each type at its own speed)
    for (const w of g.waves) {
      for (const o of w.objects) {
        o.cy += g.speed * TYPES[o.type].speed * dt;
        if (o.type === "S") o.spin += dt * 5;
        if (o.type === "D") o.spin += dt * 30;
      }
    }

    // Hits
    const sx = g.x + 5, sy = g.y + 6, sw = SHIP.w - 10, sh = SHIP.h - 12;
    if (g.safeTimer === 0) {
      outer:
      for (const w of g.waves) {
        for (const o of w.objects) {
          const t = TYPES[o.type];
          const ox = o.cx - t.hitW / 2, oy = o.cy - t.hitH / 2;
          if (sx < ox + t.hitW && sx + sw > ox && sy < oy + t.hitH && sy + sh > oy) {
            g.hull -= 1;
            if (g.hull <= 0) { state = "sunk"; g.timer = SETTINGS.sunkPause; return; }
            g.safeTimer = SETTINGS.safeTime;
            break outer;
          }
        }
      }
    }

    // Score: +1 when a whole wave has gone past the ship
    const shipBottom = Math.min(g.y + SHIP.h, H - 1);
    for (const w of g.waves) {
      if (w.passed) continue;
      const lowestTop = Math.min(...w.objects.map(o => o.cy - TYPES[o.type].h / 2));
      if (lowestTop > shipBottom) { w.passed = true; g.score += 1; }
    }

    // Remove objects that have left the screen, and empty waves
    for (const w of g.waves) w.objects = w.objects.filter(o => o.cy - 90 < H);
    g.waves = g.waves.filter(w => w.objects.length > 0);

    // Level finished?
    if (g.nextWave >= level.waves.length && g.waves.length === 0) {
      if (g.level + 1 < LEVELS.length) { state = "levelclear"; g.timer = SETTINGS.levelClearTime; }
      else { state = "won"; g.timer = SETTINGS.levelClearTime; }
    }
  }

  function moveShip(dt) {
    let dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    let dy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
    if (dx === 0 && dy === 0 && input.target) {
      // Touch / mouse: head toward the finger
      const tx = input.target.x - (g.x + SHIP.w / 2);
      const ty = input.target.y - (g.y + SHIP.h / 2);
      const dist = Math.hypot(tx, ty);
      if (dist > 4) {
        const stepLen = Math.min(dist, SETTINGS.shipSpeed * dt);
        g.x += tx / dist * stepLen;
        g.y += ty / dist * stepLen;
      }
    } else if (dx || dy) {
      const len = Math.hypot(dx, dy);
      g.x += dx / len * SETTINGS.shipSpeed * dt;
      g.y += dy / len * SETTINGS.shipSpeed * dt;
    }
    g.x = Math.max(0, Math.min(W - SHIP.w, g.x));
    g.y = Math.max(50, Math.min(H - SHIP.h, g.y));      // stay below the score bar
  }

  // Foam wake behind the ship: a spreading V of foam with a few swirls
  function updateWake(dt, emit) {
    g.wakeClock += dt;
    if (emit && g.wakeClock > 0.035) {
      g.wakeClock = 0;
      const sternX = g.x + SHIP.w / 2, sternY = g.y + SHIP.h - 4;
      for (const side of [-1, 1]) {
        g.wake.push({ x: sternX + side * 7, y: sternY, age: 0, drift: side, swirl: false });
      }
      if (Math.random() < 0.25) {
        g.wake.push({ x: sternX + (Math.random() - 0.5) * 8, y: sternY + 4, age: 0, drift: 0, swirl: true, turn: Math.random() * 6 });
      }
    }
    for (const p of g.wake) {
      p.age += dt;
      p.y += 95 * dt;
      p.x += p.drift * 34 * dt;
    }
    g.wake = g.wake.filter(p => p.age < 1.4);
  }

  // ---------- Drawing ----------
  function drawSea() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#0a5674");
    grad.addColorStop(1, "#063a52");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    const scroll = g ? g.seaScroll : performance.now() / 1000 * 30;
    // gentle wave lines
    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.lineWidth = 2;
    for (let row = -1; row < H / 46 + 1; row++) {
      const y0 = ((row * 46 + scroll) % (H + 46)) - 23;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12) {
        const y = y0 + Math.sin(x / 38 + row * 1.7 + scroll / 60) * 4;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // foam flecks
    for (const f of foam) {
      const y = (f.y + scroll * 1.2) % H;
      ctx.fillStyle = `rgba(255,255,255,${f.a})`;
      ctx.beginPath();
      ctx.ellipse(f.x, y, f.r * 2, f.r, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWake() {
    for (const p of g.wake) {
      const k = p.age / 1.4;
      if (p.swirl) {
        ctx.strokeStyle = `rgba(255,255,255,${0.4 * (1 - k)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 + k * 7, p.turn + k * 4, p.turn + k * 4 + Math.PI * 1.3);
        ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(255,255,255,${0.42 * (1 - k)})`;
        ctx.beginPath();
        ctx.ellipse(p.x, p.y, 2.5 + k * 5, 2 + k * 3, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Warship seen from above, bow pointing up
  function drawShip(x, y, flashing, t) {
    if (flashing && Math.floor(t * 10) % 2 === 0) ctx.globalAlpha = 0.35;
    const w = SHIP.w, h = SHIP.h, cx = x + w / 2;
    // bow wave
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 10, y + 14); ctx.quadraticCurveTo(cx - 2, y - 2, cx, y - 4);
    ctx.quadraticCurveTo(cx + 2, y - 2, cx + 10, y + 14);
    ctx.stroke();
    // hull
    ctx.fillStyle = "#6f7c8c";
    ctx.beginPath();
    ctx.moveTo(cx, y);
    ctx.quadraticCurveTo(x + w, y + h * 0.18, x + w, y + h * 0.4);
    ctx.lineTo(x + w, y + h * 0.9);
    ctx.lineTo(x + w * 0.85, y + h);
    ctx.lineTo(x + w * 0.15, y + h);
    ctx.lineTo(x, y + h * 0.9);
    ctx.lineTo(x, y + h * 0.4);
    ctx.quadraticCurveTo(x, y + h * 0.18, cx, y);
    ctx.closePath();
    ctx.fill();
    // deck
    ctx.fillStyle = "#9aa6b5";
    ctx.beginPath();
    ctx.moveTo(cx, y + 6);
    ctx.quadraticCurveTo(x + w - 5, y + h * 0.2, x + w - 5, y + h * 0.42);
    ctx.lineTo(x + w - 5, y + h - 6);
    ctx.lineTo(x + 5, y + h - 6);
    ctx.lineTo(x + 5, y + h * 0.42);
    ctx.quadraticCurveTo(x + 5, y + h * 0.2, cx, y + 6);
    ctx.fill();
    // forward gun
    ctx.fillStyle = "#4b5563";
    ctx.beginPath(); ctx.arc(cx, y + h * 0.26, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(cx - 1.5, y + h * 0.1, 3, 12);
    // bridge and mast
    ctx.fillStyle = "#e5e9ef";
    ctx.fillRect(cx - 9, y + h * 0.38, 18, 16);
    ctx.fillStyle = "#3b82b8";
    ctx.fillRect(cx - 7, y + h * 0.38 + 2, 14, 3);
    ctx.fillStyle = "#4b5563";
    ctx.fillRect(cx - 5, y + h * 0.6, 10, 8);                 // funnel
    // helipad
    ctx.strokeStyle = "#e5e9ef";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(cx - 8, y + h - 20, 16, 12);
    ctx.globalAlpha = 1;
  }

  function drawDrone(o) {
    const { cx, cy } = o;
    ctx.fillStyle = "rgba(0,0,0,0.18)";                         // shadow on the water
    ctx.beginPath(); ctx.ellipse(cx + 8, cy + 10, 20, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#7a3550";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx - 16, cy - 16); ctx.lineTo(cx + 16, cy + 16);
    ctx.moveTo(cx + 16, cy - 16); ctx.lineTo(cx - 16, cy + 16);
    ctx.stroke();
    for (const [dx, dy] of [[-16, -16], [16, -16], [-16, 16], [16, 16]]) {
      ctx.fillStyle = "rgba(220,230,245,0.4)";
      ctx.beginPath(); ctx.arc(cx + dx, cy + dy, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#eef2f8"; ctx.lineWidth = 2;
      const a = o.spin;
      ctx.beginPath();
      ctx.moveTo(cx + dx - Math.cos(a) * 8, cy + dy - Math.sin(a) * 8);
      ctx.lineTo(cx + dx + Math.cos(a) * 8, cy + dy + Math.sin(a) * 8);
      ctx.stroke();
    }
    ctx.fillStyle = "#5b2a3d";
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff4d6d";
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
  }

  function drawPlane(o) {
    const { cx, cy } = o;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.beginPath(); ctx.ellipse(cx + 14, cy + 18, 60, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#c8ced9";
    ctx.beginPath();
    ctx.moveTo(cx, cy - 6);
    ctx.lineTo(cx + 70, cy - 14); ctx.lineTo(cx + 70, cy - 4);
    ctx.lineTo(cx + 10, cy + 14); ctx.lineTo(cx - 10, cy + 14);
    ctx.lineTo(cx - 70, cy - 4); ctx.lineTo(cx - 70, cy - 14);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx, cy - 30);
    ctx.lineTo(cx + 22, cy - 38); ctx.lineTo(cx + 22, cy - 32);
    ctx.lineTo(cx - 22, cy - 32); ctx.lineTo(cx - 22, cy - 38);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e9edf5";
    ctx.beginPath(); ctx.ellipse(cx, cy, 8, 38, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8a93a8";
    ctx.fillRect(cx - 34, cy - 6, 8, 16);
    ctx.fillRect(cx + 26, cy - 6, 8, 16);
    ctx.fillStyle = "#3b4b7a";
    ctx.beginPath(); ctx.ellipse(cx, cy + 26, 4, 6, 0, 0, Math.PI * 2); ctx.fill();
  }

  function drawMissile(o, t) {
    const { cx, cy } = o, h = TYPES.M.h;
    const top = cy - h / 2;
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    ctx.fillRect(cx + 6, top + 10, 8, h - 10);
    ctx.fillStyle = "#ffb347";
    ctx.beginPath();
    ctx.moveTo(cx - 5, top + 4);
    ctx.lineTo(cx, top - 14 - Math.sin(t * 40 + cx) * 5);
    ctx.lineTo(cx + 5, top + 4);
    ctx.fill();
    ctx.fillStyle = "#d9dde6";
    ctx.fillRect(cx - 6, top + 4, 12, h - 20);
    ctx.fillStyle = "#e63946";
    ctx.beginPath();
    ctx.moveTo(cx - 6, top + h - 16); ctx.lineTo(cx, top + h); ctx.lineTo(cx + 6, top + h - 16);
    ctx.fill();
    ctx.fillStyle = "#6c7486";
    ctx.beginPath();
    ctx.moveTo(cx - 6, top + 6); ctx.lineTo(cx - 12, top + 2); ctx.lineTo(cx - 6, top + 18);
    ctx.moveTo(cx + 6, top + 6); ctx.lineTo(cx + 12, top + 2); ctx.lineTo(cx + 6, top + 18);
    ctx.fill();
  }

  function drawShoe(o) {
    ctx.save();
    ctx.translate(o.cx, o.cy);
    ctx.rotate(o.spin);
    ctx.fillStyle = "#f2f2f2";
    ctx.beginPath(); ctx.roundRect(-24, 6, 48, 8, 4); ctx.fill();
    ctx.fillStyle = "#ff6b35";
    ctx.beginPath();
    ctx.moveTo(-22, 6); ctx.lineTo(-22, -12);
    ctx.quadraticCurveTo(-18, -16, -10, -14);
    ctx.lineTo(-4, -4);
    ctx.quadraticCurveTo(14, -6, 24, 6);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -9); ctx.lineTo(-2, -2);
    ctx.moveTo(-2, -10); ctx.lineTo(4, -3);
    ctx.stroke();
    ctx.restore();
  }

  function drawObjects(t) {
    for (const w of g.waves) for (const o of w.objects) {
      if (o.type === "D") drawDrone(o);
      else if (o.type === "P") drawPlane(o);
      else if (o.type === "M") drawMissile(o, t);
      else drawShoe(o);
    }
  }

  function drawHud() {
    ctx.fillStyle = "rgba(3,30,44,0.55)";
    ctx.fillRect(0, 0, W, 46);
    ctx.fillStyle = "#eaf6ff";
    ctx.font = "bold 28px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(String(g.score), W / 2, 34);

    ctx.textAlign = "left";
    ctx.font = "bold 14px system-ui, sans-serif";
    ctx.fillStyle = "#9fc3d6";
    ctx.fillText("HULL", 14, 29);
    for (let i = 0; i < SETTINGS.hull; i++) {
      ctx.fillStyle = i < g.hull ? "#7cf29c" : "#1b4a5e";
      ctx.fillRect(58 + i * 20, 17, 15, 14);
    }
    ctx.textAlign = "right";
    ctx.fillStyle = "#9fc3d6";
    ctx.fillText(`LEVEL ${g.level + 1}/${LEVELS.length}`, W - 14, 29);

    if (state === "playing" && g.bannerTimer > 0) {
      const a = Math.min(1, g.bannerTimer * 1.5);
      ctx.textAlign = "center";
      ctx.fillStyle = `rgba(255,209,102,${a})`;
      ctx.font = "bold 30px system-ui, sans-serif";
      ctx.fillText(`Level ${g.level + 1}`, W / 2, 160);
      ctx.fillStyle = `rgba(234,246,255,${a})`;
      ctx.font = "20px system-ui, sans-serif";
      ctx.fillText(LEVELS[g.level].name, W / 2, 190);
      if (g.level === 0) {
        ctx.font = "15px system-ui, sans-serif";
        ctx.fillText("Arrow keys to steer · touch to move on a phone", W / 2, 220);
      }
    }
  }

  function drawBanner(text, sub) {
    ctx.fillStyle = "rgba(3,30,44,0.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#eaf6ff";
    ctx.font = "bold 38px system-ui, sans-serif";
    ctx.fillText(text, W / 2, H / 2);
    if (sub) {
      ctx.font = "18px system-ui, sans-serif";
      ctx.fillStyle = "#9fc3d6";
      ctx.fillText(sub, W / 2, H / 2 + 36);
    }
  }

  function draw(t) {
    drawSea();
    if (!g) return;
    drawWake();
    drawShip(g.x, g.y, g.safeTimer > 0 || state === "sunk", t);
    drawObjects(t);
    drawHud();
    if (state === "paused") drawBanner("Paused", "Tap or press Space to continue");
    if (state === "levelclear") drawBanner(`Level ${g.level + 1} cleared!`, `Next: ${LEVELS[g.level + 1].name}`);
    if (state === "won") drawBanner("All levels cleared!", "Score: " + g.score);
    if (state === "sunk") drawBanner("Sunk!", "Score: " + g.score);
  }

  // ---------- Main loop (fixed steps, one loop for the whole page) ----------
  const STEP = 1 / 120;
  let lastTime = performance.now();
  let acc = 0, visualTime = 0;
  function frame(now) {
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;                // after a long gap, never jump ahead
    if (state !== "menu" && state !== "paused") {
      acc += dt;
      while (acc >= STEP && state !== "menu") { step(STEP); acc -= STEP; }
    } else {
      acc = 0;
    }
    if (state !== "paused") visualTime += dt;
    draw(visualTime);
    requestAnimationFrame(frame);
  }

  // ---------- Controls ----------
  const KEYS = {
    ArrowLeft: "left", KeyA: "left",
    ArrowRight: "right", KeyD: "right",
    ArrowUp: "up", KeyW: "up",
    ArrowDown: "down", KeyS: "down"
  };

  window.addEventListener("keydown", (e) => {
    const dir = KEYS[e.code];
    const isStart = e.code === "Space" || e.key === "Enter";
    if (!dir && !isStart) return;

    if (state === "menu") {
      if (!isStart) return;
      e.preventDefault();
      if (e.repeat) return;
      if (performance.now() - menuOpenedAt < 400) return;     // avoid accidental restart
      startGame();
      return;
    }
    e.preventDefault();
    if (state === "paused") {
      if (!e.repeat) state = "playing";
      if (isStart) return;
    }
    if (dir) input[dir] = true;
  });

  window.addEventListener("keyup", (e) => {
    const dir = KEYS[e.code];
    if (dir) input[dir] = false;
  });

  // Touch / mouse: the ship heads toward where you hold your finger
  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  canvas.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (state === "paused") { state = "playing"; return; }
    if (state !== "playing") return;
    canvas.setPointerCapture?.(e.pointerId);
    input.target = toCanvas(e);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (input.target) input.target = toCanvas(e);
  });
  for (const ev of ["pointerup", "pointercancel"]) {
    canvas.addEventListener(ev, () => { input.target = null; });
  }

  newGameBtn.addEventListener("click", () => { if (state === "menu") startGame(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
  window.addEventListener("blur", pause);

  // Read-only peek for testing in the browser console
  window.droneDodger = {
    get state() { return state; },
    get score() { return g ? g.score : 0; },
    get hull() { return g ? g.hull : SETTINGS.hull; },
    get level() { return g ? g.level : 0; },
    get speed() { return g ? g.speed : 0; },
    get x() { return g ? g.x : 0; },
    get y() { return g ? g.y : 0; },
    get nextWave() { return g ? g.nextWave : 0; },
    get waves() {
      return g ? g.waves.map(w => ({ index: w.index, passed: w.passed, objects: w.objects.map(o => ({ type: o.type, cx: o.cx, cy: o.cy })) })) : [];
    },
    get lastScore() { return lastScore; },
    get topScore() { return topScore; },
    levelChecks: LEVEL_CHECKS,
    levels: LEVELS,
    lane: LANE, ship: SHIP
  };

  showMenu("");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
